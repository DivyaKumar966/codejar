
spring.application.name=codejar

# Neon PostgreSQL
spring.datasource.url=jdbc:postgresql://ep-cold-salad-b4cizgw0-pooler.c-6.us-east-2.aws.neon.tech/codejar?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Code execution
codejar.execution.timeout-seconds=5
codejar.execution.java-command=java
codejar.execution.javac-command=javac
codejar.execution.python-command=python3

# Server
server.port=${PORT:8080}

# Admin configuration
codejar.admin.email=${CODEJAR_ADMIN_EMAIL:}
codejar.admin.password=${CODEJAR_ADMIN_PASSWORD:}
